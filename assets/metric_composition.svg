<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Dataset, modality and objective composition</title>
  <desc id="description">Three panels show a multi-dataset multimodal metric-learning experiment. MultiDatasetPipeline interleaves source A and B, consuming one source batch per step. MultimodalPipeline routes RGB and thermal samples to their corresponding encoder and aggregation, head and BN modules, which may be shared or independent. Outputs retain sample order. A distinct dashed route supplies the selected source supervision and loss settings to GeoMetricLoss. The primary metric objective is required; the second metric objective and auxiliary objectives are optional. Lightning manages the shared model and optimizer, AMP, distributed execution and checkpoints. Dataset readers and modality names in this diagram are examples supplied by downstream users.</desc>
