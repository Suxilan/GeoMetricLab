  <text x="382" y="35" font-size="22" font-weight="bold" fill="#203047" text-anchor="start">(b)  Modality routing</text>
  <text x="924" y="35" font-size="22" font-weight="bold" fill="#203047" text-anchor="start">(c)  Loss composition</text>
