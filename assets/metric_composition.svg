    <style>text { font-family: Arial, Helvetica, "DejaVu Sans", sans-serif; }</style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#536575"/></marker>
    <marker id="gt-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#00856b"/></marker>
  </defs>
