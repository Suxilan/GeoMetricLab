<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Class labels, explicit pairs and triplets, and relation matrices</title>
  <desc id="description">Three panels compare class labels with explicit pair or triplet supervision and a matrix of observed relations. The label baseline groups A and B as ID 0 and C and D as ID 1. The independent relation example has positive A–B and B–C, negative A–C and A–D, and unknown B–D and C–D. The matrix encodes exactly those observed pairs. The separate triplet example is (A, B, C), meaning anchor A, positive B, negative C. Unknown and self pairs are excluded. These are alternative inputs to a compatible PML objective, not automatic conversions among all representations.</desc>
