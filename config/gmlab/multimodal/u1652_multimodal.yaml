# Cross-view component recipe, not a claimed reproduction of a trained baseline.
# Train with the existing gmlab.train CLI. Change paths and hardware for your run.
extends: base.yaml
pipeline:
  modalities: [satellite, drone]

model:
  type: ModalityEncoder
  encoder:
    type: GeoEncoder
    backbone:
      type: ResNet
      backbone_name: resnet18
      pretrained: false
      crop_last_block: false
    use_bn: false
    whitening: true
    whitening_dim: 128
    final_norm: false
  feature_adapter: descriptor_features
  heads:
    satellite:
      type: Linear
      in_features: 128
      out_features: 64
    drone:
      type: Linear
      in_features: 128
      out_features: 64
  normalize: true

loss:
  type: GeoMetricLoss
  primary_objective:
    type: MetricObjective
    distributed: false


optimizer:
  type: AdamW
  lr: 0.0001
  groups:
  - prefixes:
    - model.encoder
    lr: 1.0e-05
  - prefixes:
    - model.heads
    lr: 0.0001

data:
  transforms:
    satellite_train:
      - {type: RandomResizedCrop, size: [224, 224], scale: [0.76, 1.0], ratio: [1.0, 1.0], interpolation: bicubic}
      - {type: ToImage}
      - {type: ColorJitter, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.05}
      - {type: ToDtype, dtype: float32, scale: true}
      - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    drone_train:
      - {type: RandomResizedCrop, size: [256, 256], scale: [0.76, 1.0], ratio: [1.0, 1.0], interpolation: bicubic}
      - {type: ToImage}
      - {type: ToDtype, dtype: float32, scale: true}
      - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    satellite_eval:
      - {type: Resize, size: [224, 224], interpolation: bicubic}
      - {type: ToImage}
      - {type: ToDtype, dtype: float32, scale: true}
      - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    drone_eval:
      - {type: Resize, size: [256, 256], interpolation: bicubic}
      - {type: ToImage}
      - {type: ToDtype, dtype: float32, scale: true}
      - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  train:
    transform:
      by_modality: {satellite: satellite_train, drone: drone_train}
    dataset:
      type: datasets.train.u1652.University1652InstanceDataset
      dataset_path: data/university1652/train
      views: [satellite, drone]
      sampler:
        type: ModalityQuotaSampler
        quotas: {satellite: 1, drone: 2}
        replacement: true
        missing: skip
    loader:
      batch_size: 4
      shuffle: true
      num_workers: 4
      collate_fn: group_cross_modal_samples
  valid:
    sources:
      drone2satellite:
        transform: &eval_transform
          by_modality: {satellite: satellite_eval, drone: drone_eval}
        dataset:
          type: datasets.valid.u1652.u1652_retrieval
          metadata_path: data/university1652/test
          split: test
          direction: drone2satellite
        loader: &eval_loader
          batch_size: 32
          num_workers: 4
          collate_fn: modality_collate
      satellite2drone:
        transform: *eval_transform
        dataset:
          type: datasets.valid.u1652.u1652_retrieval
          metadata_path: data/university1652/test
          split: test
          direction: satellite2drone
        loader: *eval_loader

runtime:
  run_dir: results/gmlab/u1652_multimodal
  checkpoint:
    save_top_k: 3
    monitor: val/drone2satellite/mAP
    mode: max
  trainer:
    accelerator: auto
    devices: 1
    precision: bf16-mixed
    max_epochs: 20
    log_every_n_steps: 1
  evaluation_trainer:
    accelerator: auto
    devices: 1
